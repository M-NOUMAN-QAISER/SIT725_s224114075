<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books Catalogue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      color: #222;
    }

    header {
      background-color: #1a3c5e;
      color: #fff;
      padding: 20px 32px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 36px auto;
      padding: 0 20px;
    }

    p.instruction {
      font-size: 0.95rem;
      color: #444;
      margin-bottom: 16px;
    }

    /* ── Button ── */
    #btn-get-books {
      background-color: #1a3c5e;
      color: #fff;
      border: none;
      padding: 10px 22px;
      font-size: 0.95rem;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 28px;
    }

    #btn-get-books:hover {
      background-color: #14304f;
    }

    /* ── Two-column layout ── */
    #catalog-wrapper {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    /* ── Book list ── */
    #book-list {
      list-style: none;
      min-width: 270px;
      flex-shrink: 0;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
    }

    #book-list li {
      padding: 12px 16px;
      border-bottom: 1px solid #e8ecf0;
      cursor: pointer;
      font-size: 0.92rem;
      transition: background 0.15s;
    }

    #book-list li:last-child {
      border-bottom: none;
    }

    #book-list li:hover {
      background-color: #eef3f8;
    }

    #book-list li.active {
      background-color: #d6e4f0;
      font-weight: bold;
    }

    /* ── Detail panel ── */
    #detail-panel {
      display: none;
      flex: 1;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 20px 24px;
    }

    #detail-panel.visible {
      display: block;
    }

    #detail-panel h2 {
      font-size: 1.05rem;
      color: #1a3c5e;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #1a3c5e;
    }

    .detail-row {
      display: flex;
      gap: 10px;
      margin-bottom: 11px;
      font-size: 0.92rem;
    }

    .detail-label {
      font-weight: bold;
      color: #333;
      min-width: 105px;
      flex-shrink: 0;
    }

    .detail-value {
      color: #555;
      line-height: 1.55;
    }

    /* ── Error message ── */
    #error-msg {
      color: #c0392b;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Books Catalogue developed by s224114075</h1>
  </header>

  <main>
    <p class="instruction">Click the button below to get all book items from the server:</p>

    <button id="btn-get-books">Get all books</button>

    <p id="error-msg"></p>

    <div id="catalog-wrapper">
      <ul id="book-list"></ul>

      <div id="detail-panel">
        <h2>Book Details</h2>
        <div class="detail-row">
          <span class="detail-label">Title:</span>
          <span class="detail-value" id="d-title"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Author:</span>
          <span class="detail-value" id="d-author"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Year:</span>
          <span class="detail-value" id="d-year"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Genre:</span>
          <span class="detail-value" id="d-genre"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Summary:</span>
          <span class="detail-value" id="d-summary"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Price (AUD):</span>
          <span class="detail-value" id="d-price"></span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const btnGetBooks  = document.getElementById('btn-get-books');
    const bookList     = document.getElementById('book-list');
    const detailPanel  = document.getElementById('detail-panel');
    const errorMsg     = document.getElementById('error-msg');

    const dTitle   = document.getElementById('d-title');
    const dAuthor  = document.getElementById('d-author');
    const dYear    = document.getElementById('d-year');
    const dGenre   = document.getElementById('d-genre');
    const dSummary = document.getElementById('d-summary');
    const dPrice   = document.getElementById('d-price');

    // ── "Get all books" button ──
    btnGetBooks.addEventListener('click', () => {
      errorMsg.textContent = '';
      bookList.innerHTML = '';
      detailPanel.classList.remove('visible');

      fetch('/api/books')
        .then(res => {
          if (!res.ok) throw new Error('Server returned ' + res.status);
          return res.json();
        })
        .then(books => {
          if (books.length === 0) {
            errorMsg.textContent = 'No books found in the database.';
            return;
          }
          books.forEach(book => {
            const li = document.createElement('li');
            li.textContent = `${book.title} ${book.price} AUD`;
            li.dataset.id = book.id;
            li.addEventListener('click', () => loadBookDetail(book.id, li));
            bookList.appendChild(li);
          });
        })
        .catch(err => {
          errorMsg.textContent = 'Error fetching books: ' + err.message;
        });
    });

    // ── Click a list item — fetch full detail ──
    function loadBookDetail(id, activeLi) {
      // Highlight active row
      document.querySelectorAll('#book-list li').forEach(el => el.classList.remove('active'));
      activeLi.classList.add('active');

      errorMsg.textContent = '';

      fetch(`/api/books/${id}`)
        .then(res => {
          if (!res.ok) throw new Error('Server returned ' + res.status);
          return res.json();
        })
        .then(book => {
          dTitle.textContent   = book.title;
          dAuthor.textContent  = book.author;
          dYear.textContent    = book.year;
          dGenre.textContent   = book.genre;
          dSummary.textContent = book.summary;
          dPrice.textContent   = `$${book.price} AUD`;
          detailPanel.classList.add('visible');
        })
        .catch(err => {
          errorMsg.textContent = 'Error loading book details: ' + err.message;
        });
    }
  </script>

</body>
</html>
